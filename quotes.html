<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음 서가 | 감정별 명언 추천</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#262640; --sub:#6b6b82; --accent:#5b46c0; --line:#e6e4f2; --c:#5b46c0; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f7f6fc; color:var(--ink); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; line-height:1.7; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 20px 64px; }
  button { font:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

  header { text-align:center; margin-bottom:28px; }
  .kicker { font-weight:800; font-size:.78rem; letter-spacing:.2em; color:var(--accent); margin:0 0 8px; }
  h1 { font-size:clamp(1.9rem,6vw,2.6rem); letter-spacing:-.04em; margin:0 0 8px; }
  .sub { color:var(--sub); margin:0; font-weight:500; }

  .emotions { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .emo { background:#fff; border:2px solid var(--line); border-radius:20px; padding:16px 8px; font-weight:700; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:4px; line-height:1.35; }
  .emo .ic { font-size:1.6rem; }
  .emo:hover { border-color:var(--ec); }
  .emo[aria-pressed=true] { border-color:var(--ec); background:var(--ebg); color:var(--ec); }

  /* 도서 목록 카드 */
  .card { position:relative; background:#fff; border:1px solid var(--line); border-radius:26px; padding:34px 36px 28px; box-shadow:0 24px 50px -30px rgba(70,60,140,.35);
    background-image:repeating-linear-gradient(transparent 0 35px, #efedf8 35px 36px); background-position:0 24px; min-height:290px; display:flex; flex-direction:column; }
  .card::before { content:""; position:absolute; left:50%; top:12px; width:12px; height:12px; border-radius:50%; border:2px solid var(--line); background:#f7f6fc; transform:translateX(-50%); }
  .meta { display:flex; justify-content:space-between; gap:10px; font-size:.82rem; font-weight:700; color:var(--c); margin-bottom:14px; }
  .quote { font-family:"Gowun Batang","Noto Serif KR",serif; font-size:clamp(1.25rem,4.4vw,1.65rem); line-height:1.65; letter-spacing:-.02em; margin:0; flex:1; display:flex; align-items:center; }
  .speaker { text-align:right; font-weight:700; color:var(--sub); margin:16px 0 0; }
  .empty { color:var(--sub); font-family:var(--sans); font-size:1.05rem; }
  .actions { display:flex; justify-content:center; margin-top:20px; }
  .more { background:var(--accent); color:#fff; border:0; border-radius:999px; padding:14px 32px; font-weight:700; font-size:1.02rem; box-shadow:0 12px 24px -12px rgba(91,70,192,.8); }
  .more:disabled { background:#c9c3e6; box-shadow:none; cursor:not-allowed; }
  .more:not(:disabled):hover { filter:brightness(.92); }

  /* 관리 */
  details { margin-top:34px; background:#fff; border:1px solid var(--line); border-radius:22px; padding:6px 24px; }
  summary { cursor:pointer; font-weight:800; padding:16px 0; }
  .manage { padding-bottom:22px; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .tabs button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 14px; font-weight:500; color:var(--sub); }
  .tabs button[aria-pressed=true] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .count { color:var(--sub); font-size:.88rem; margin:0 0 10px; }
  .count.warn { color:#b42318; font-weight:700; }
  ul.list { list-style:none; margin:0 0 20px; padding:0; max-height:300px; overflow:auto; border:1px solid var(--line); border-radius:14px; }
  ul.list li { display:flex; gap:10px; align-items:flex-start; padding:10px 14px; border-bottom:1px solid var(--line); }
  ul.list li:last-child { border-bottom:0; }
  ul.list .t { flex:1; font-size:.94rem; }
  ul.list .t small { display:block; color:var(--sub); }
  ul.list button { border:1px solid #e9c4c0; background:#fff; color:#b42318; border-radius:8px; padding:3px 10px; font-size:.85rem; }
  form.add { display:grid; gap:10px; }
  form.add .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input, select { font:inherit; padding:11px 14px; border:1px solid var(--line); border-radius:12px; background:#fff; width:100%; min-width:0; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .btn { border:0; background:var(--ink); color:#fff; border-radius:12px; padding:11px 20px; font-weight:700; }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:500; }
  .msg { color:var(--sub); font-size:.88rem; min-height:1.4em; margin:0; }

  footer { text-align:center; color:var(--sub); font-size:.88rem; margin-top:34px; }

  @media (max-width:560px) {
    .emotions { grid-template-columns:1fr 1fr; }
    .card { padding:30px 22px 24px; }
    form.add .two { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="kicker">MIND LIBRARY · 인터넷자원론 바이브코딩 실습</p>
    <h1>마음 서가</h1>
    <p class="sub">지금 느끼는 감정을 누르면, 그 마음에 맞는 한 문장을 서가에서 꺼내 드려요.</p>
  </header>

  <section aria-label="감정 선택">
    <div class="emotions" id="emotions" role="group" aria-label="감정 상태 버튼"></div>
  </section>

  <section aria-label="명언 카드">
    <article class="card" id="card" aria-live="polite">
      <div class="meta"><span id="metaLeft">서가 대기 중</span><span id="metaRight"></span></div>
      <p class="quote" id="quote"><span class="empty">위에서 지금의 감정을 골라 보세요.</span></p>
      <p class="speaker" id="speaker"></p>
    </article>
    <div class="actions"><button type="button" class="more" id="more" disabled>다른 명언 보기 ↻</button></div>
  </section>

  <details id="manageBox">
    <summary>명언 목록 관리 (추가 · 삭제)</summary>
    <div class="manage">
      <div class="tabs" id="mTabs" role="group" aria-label="관리할 감정"></div>
      <p class="count" id="mCount"></p>
      <ul class="list" id="mList"></ul>
      <form class="add" id="addForm">
        <div class="two">
          <select id="addEmo" aria-label="감정 선택"></select>
          <input type="text" id="addWho" placeholder="발언자 (예: 속담, 헬렌 켈러)" maxlength="30">
        </div>
        <input type="text" id="addText" placeholder="추가할 명언을 입력하세요" maxlength="120" required>
        <div class="row">
          <button type="submit" class="btn">명언 추가</button>
          <button type="button" class="btn ghost" id="reset">처음 상태로 되돌리기</button>
        </div>
        <p class="msg" id="msg" role="status"></p>
      </form>
    </div>
  </details>

  <footer>
    <p>만든 사람 천고은 · 컴퓨터교육 × 문헌정보 &nbsp;|&nbsp; 같은 명언이 연달아 나오지 않아요.</p>
  </footer>
</div>

      ["느리게 가는 것을 두려워하지 말고, 멈춰 서는 것을 두려워하라.","중국 속담"],
      ["서두르지 마라. 그러나 쉬지도 마라.","요한 볼프강 폰 괴테"],

  var KEY = "maum-seoga-v1";
  var data = load();
  var current = null, lastIdx = {}, shown = null, manageEmo = "joy";

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() {
    try { var s = localStorage.getItem(KEY); if (s) { var d = JSON.parse(s); if (d && d.joy && d.sad && d.tired && d.anx) return d; } } catch (e) {}
    return clone(DEFAULTS);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  function emo(id) { return EMOS.filter(function (e) { return e.id === id; })[0]; }
  function $(id) { return document.getElementById(id); }

  /* 감정 버튼 */
  var emoBox = $("emotions");
  EMOS.forEach(function (e) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "emo"; b.dataset.id = e.id; b.setAttribute("aria-pressed", "false");
    b.style.setProperty("--ec", e.color); b.style.setProperty("--ebg", e.bg);
    b.innerHTML = '<span class="ic" aria-hidden="true">' + e.icon + '</span><span>' + e.label + '</span>';
    b.onclick = function () { pick(e.id); };
    emoBox.appendChild(b);
  });

  function pick(id) {
    current = id;
    document.querySelectorAll(".emo").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.id === id); });
    $("more").disabled = false;
    showQuote();
  }

  function showQuote() {
    var list = data[current], e = emo(current);
    $("card").style.setProperty("--c", e.color);
    $("metaLeft").textContent = e.label;
    if (!list.length) {
      $("quote").innerHTML = '<span class="empty">이 서가에는 아직 명언이 없어요. 아래 관리 메뉴에서 추가해 보세요.</span>';
      $("speaker").textContent = ""; $("metaRight").textContent = ""; return;
    }
    var i;
    if (list.length === 1) i = 0;
    else { do { i = Math.floor(Math.random() * list.length); } while (i === lastIdx[current]); }
    lastIdx[current] = i;
    $("quote").textContent = "“" + list[i][0] + "”";
    $("speaker").textContent = "— " + list[i][1];
    $("metaRight").textContent = "No. " + String(i + 1).padStart(2, "0") + " / " + list.length;
  }
  $("more").onclick = function () { if (current) showQuote(); };

  /* 관리 */
  var mTabs = $("mTabs"), addEmo = $("addEmo");
  EMOS.forEach(function (e) {
    var t = document.createElement("button");
    t.type = "button"; t.dataset.id = e.id; t.textContent = e.label; t.setAttribute("aria-pressed", e.id === manageEmo);
    t.onclick = function () { manageEmo = e.id; addEmo.value = e.id; renderManage(); };
    mTabs.appendChild(t);
    var o = document.createElement("option"); o.value = e.id; o.textContent = e.label; addEmo.appendChild(o);
  });
  addEmo.value = manageEmo;
  addEmo.onchange = function () { manageEmo = addEmo.value; renderManage(); };

  function renderManage() {
    mTabs.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.id === manageEmo); });
    var list = data[manageEmo];
    var c = $("mCount");
    c.textContent = "현재 " + list.length + "개" + (list.length < 20 ? " · 최소 20개 이상을 권장해요" : "");
    c.className = "count" + (list.length < 20 ? " warn" : "");
    var ul = $("mList"); ul.innerHTML = "";
    list.forEach(function (q, i) {
      var li = document.createElement("li");
      var t = document.createElement("div"); t.className = "t";
      t.textContent = q[0];
      var s = document.createElement("small"); s.textContent = "— " + q[1]; t.appendChild(s);
      var d = document.createElement("button"); d.type = "button"; d.textContent = "삭제";
      d.setAttribute("aria-label", "명언 삭제: " + q[0]);
      d.onclick = function () {
        list.splice(i, 1); save();
        if (lastIdx[manageEmo] !== undefined) delete lastIdx[manageEmo];
        renderManage(); say("삭제했어요.");
        if (current === manageEmo) showQuote();
      };
      li.appendChild(t); li.appendChild(d); ul.appendChild(li);
    });
  }
  function say(m) { $("msg").textContent = m; }

  $("addForm").onsubmit = function (ev) {
    ev.preventDefault();
    var text = $("addText").value.trim(), who = $("addWho").value.trim() || "작자 미상", id = addEmo.value;
    if (!text) { say("명언을 입력해 주세요."); return; }
    var dup = data[id].some(function (q) { return q[0] === text; });
    if (dup) { say("이미 같은 문장이 있어요."); return; }
    data[id].push([text, who]); save();
    manageEmo = id; $("addText").value = ""; $("addWho").value = "";
    renderManage(); say("추가했어요. (" + emo(id).label + ")");
  };
  $("reset").onclick = function () {
    if (!confirm("추가·삭제한 내용을 모두 지우고 처음 명언 목록으로 되돌릴까요?")) return;
    data = clone(DEFAULTS); save(); lastIdx = {}; renderManage(); say("처음 상태로 되돌렸어요.");
    if (current) showQuote();
  };

  renderManage();
</script>
</body>
</html>
