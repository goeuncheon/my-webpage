<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="다가오는 생일을 함께 기록하고 확인하는 생일 달력">
<title>우리 반 생일 | 천고은</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1b3d;--sub:#6d6a8a;--accent:#6c4de6;--pink:#ff7eb6;--line:#e9e5fb;--soft:#f1edff;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;min-height:100vh;line-height:1.7;background:radial-gradient(900px 520px at 8% -8%,#e6dcff 0,transparent 62%),radial-gradient(700px 420px at 100% 0,#ffe2f0 0,transparent 60%),#faf9ff}.wrap{max-width:900px;margin:auto;padding:22px 18px 50px}.homelink{display:inline-block;margin-bottom:18px;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--accent);font-weight:700;text-decoration:none}.top{text-align:center;margin:14px 0 25px}.kicker{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.08em}h1{font-size:clamp(2rem,7vw,2.8rem);line-height:1.2;letter-spacing:-.04em;margin:4px 0}.sub{color:var(--sub);margin:4px 0}.panel{padding:clamp(18px,4vw,28px);border:1px solid var(--line);border-radius:26px;background:#ffffffed;box-shadow:0 24px 60px -42px #5641a6}.banner{padding:11px 14px;margin:0 0 18px;border-radius:14px;font-size:.88rem;font-weight:700}.banner.live{background:#e5f6f3;color:#1f705d}.banner.demo{background:#fff7dc;color:#805700}.banner.error{background:#ffefef;color:#a21c1c}h2.sec{font-size:1.1rem;margin:22px 0 10px}.highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.birthday-card{border-radius:20px;padding:16px;color:white;background:linear-gradient(135deg,#6c4de6,#ff7eb6)}.birthday-card:nth-child(2){background:linear-gradient(135deg,#2fc4a5,#6c4de6)}.birthday-card:nth-child(3){background:linear-gradient(135deg,#ffa81c,#ff6fae)}.days{font-family:"Plus Jakarta Sans",sans-serif;font-size:1.6rem;font-weight:800}.person{font-size:1.05rem;font-weight:800}.meta{font-size:.84rem;opacity:.93}form.add{display:grid;grid-template-columns:1fr 1fr 90px 90px auto;gap:8px}input,select,button{font:inherit}form.add input,form.add select{min-width:0;padding:10px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}.btn{border:0;border-radius:999px;padding:10px 20px;background:linear-gradient(135deg,#6c4de6,#8e6cf7);color:white;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.msg{min-height:1.6em;font-weight:700;margin:8px 0 0;font-size:.9rem}.msg.ok{color:#237a4b}.msg.no{color:#b42318}.filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 13px;color:var(--sub);cursor:pointer}.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.bar select{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}ul.list{list-style:none;padding:0;margin:0;display:grid;gap:8px}ul.list li{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:15px}.nm{font-weight:800}.tag{margin-left:7px;padding:1px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.78rem;font-weight:700}.dt{margin-left:auto;text-align:right;color:var(--sub);font-size:.9rem}.dd{display:inline-block;min-width:60px;text-align:center;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:800}.dd.today{background:#ff6fae;color:white}.empty{text-align:center;color:var(--sub);padding:20px 0}footer{text-align:center;margin-top:24px;color:var(--sub);font-size:.86rem}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(max-width:700px){form.add{grid-template-columns:1fr 1fr}form.add button{grid-column:1/-1}}
</style>
</head>
<body>
<main class="wrap">
<a class="homelink" href="index.html#projects">← 천고은의 홈페이지</a>
<header class="top"><p class="kicker">구글 시트 연동 · 우리 반 생일 달력</p><h1>🎂 우리 반 생일 달력</h1><p class="sub">다가오는 생일을 함께 기록하고 축하해요.</p></header>
<section class="panel" aria-label="학급 생일 관리">
<p class="banner demo" id="banner" role="status"></p>
<h2 class="sec" style="margin-top:0">🎉 다가오는 생일</h2><div class="highlights" id="highlights"></div>
<h2 class="sec">생일 등록하기</h2>
<form class="add" id="form"><input id="name" type="text" placeholder="이름" maxlength="20" required aria-label="이름"><input id="memo" type="text" placeholder="소속·메모 (선택)" maxlength="30" aria-label="소속 또는 메모"><select id="month" aria-label="월" required></select><select id="day" aria-label="일" required></select><button class="btn" id="save" type="submit">등록</button></form>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<h2 class="sec">생일 목록</h2><div class="filters" id="filters" role="group" aria-label="월별 조회"></div>
<div class="bar"><span class="sub" id="count"></span><label>정렬 <select id="sort"><option value="dday">다가오는 생일 순</option><option value="date">월·일 순</option><option value="name">이름 순</option></select></label></div><ul class="list" id="list"></ul>
</section><footer>만든 사람 천고은 · 컴퓨터교육 × 문헌정보</footer>
</main>
<script>
// Apps Script 웹 앱을 배포한 뒤 끝에 /exec가 붙은 URL을 여기에 설정하세요.
var BIRTHDAY_WEB_APP_URL = "";
(function(){
  var $=function(id){return document.getElementById(id);};
  var endpoint=/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(BIRTHDAY_WEB_APP_URL);
  var birthdays=[],selectedMonth=0,callbackId=0;
  $('banner').textContent=endpoint?'✅ Google 스프레드시트에 연결되어 있어요.':'⚙️ 시트 연결 설정이 필요해요. 관리자에게 연결을 요청해 주세요.';
  $('banner').className='banner '+(endpoint?'live':'demo');
  function message(text,ok){$('msg').textContent=text;$('msg').className='msg '+(ok?'ok':'no');}
  function jsonp(action){return new Promise(function(resolve,reject){var cb='birthdayCallback'+(++callbackId);var script=document.createElement('script');var timer=setTimeout(cleanup,15000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove();}window[cb]=function(result){cleanup();if(result&&result.ok)resolve(result.data||[]);else reject(new Error(result&&result.error||'시트에서 목록을 가져오지 못했습니다.'));};script.onerror=function(){cleanup();reject(new Error('웹 앱에 연결하지 못했어요. 배포 URL과 액세스 권한을 확인해 주세요.'));};script.src=BIRTHDAY_WEB_APP_URL+'?action='+encodeURIComponent(action)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(script);});}
  function sendBirthday(item){var body=new URLSearchParams({action:'add',name:item.name,memo:item.memo,month:item.month,day:item.day});return fetch(BIRTHDAY_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});}
  function dayCount(month,day){var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),date=new Date(today.getFullYear(),month-1,day);if(date<today)date=new Date(today.getFullYear()+1,month-1,day);return Math.round((date-today)/86400000);}
  function dayText(n){return n===0?'오늘 🎉':'D-'+n;}
  function render(){var enriched=birthdays.map(function(x){return {name:String(x.name||''),memo:String(x.memo||''),month:Number(x.month),day:Number(x.day),dd:dayCount(Number(x.month),Number(x.day))};}).filter(function(x){return x.name&&x.month>=1&&x.month<=12&&x.day>=1&&x.day<=31;});
    var cards=$('highlights');cards.replaceChildren();enriched.slice().sort(function(a,b){return a.dd-b.dd;}).slice(0,3).forEach(function(x){var card=document.createElement('article');card.className='birthday-card';var d=document.createElement('div');d.className='days';d.textContent=dayText(x.dd);var n=document.createElement('div');n.className='person';n.textContent=x.name;var m=document.createElement('div');m.className='meta';m.textContent=(x.memo?x.memo+' · ':'')+x.month+'월 '+x.day+'일';card.append(d,n,m);cards.appendChild(card);});if(!cards.children.length)cards.innerHTML='<p class="empty">아직 등록된 생일이 없어요.</p>';
    var rows=enriched.filter(function(x){return !selectedMonth||x.month===selectedMonth;}),sort=$('sort').value;rows.sort(function(a,b){return sort==='name'?a.name.localeCompare(b.name,'ko'):sort==='date'?(a.month-b.month||a.day-b.day):a.dd-b.dd;});$('count').textContent=(selectedMonth?selectedMonth+'월 ':'전체 ')+rows.length+'명';var list=$('list');list.replaceChildren();if(!rows.length){list.innerHTML='<li class="empty">등록된 생일이 없어요.</li>';return;}rows.forEach(function(x){var li=document.createElement('li'),left=document.createElement('span'),name=document.createElement('span'),date=document.createElement('span'),dd=document.createElement('span');name.className='nm';name.textContent=x.name;left.appendChild(name);if(x.memo){var tag=document.createElement('span');tag.className='tag';tag.textContent=x.memo;left.appendChild(tag);}date.className='dt';date.append(document.createTextNode(x.month+'월 '+x.day+'일　'));dd.className='dd'+(x.dd===0?' today':'');dd.textContent=dayText(x.dd);date.appendChild(dd);li.append(left,date);list.appendChild(li);});
  }
  function load(){if(!endpoint)return;jsonp('list').then(function(items){birthdays=items;render();}).catch(function(error){$('banner').className='banner error';$('banner').textContent='시트 목록을 불러오지 못했어요. 관리자에게 연결 설정을 확인해 달라고 요청해 주세요.';message(error.message,false);});}
  for(var m=1;m<=12;m++){var option=document.createElement('option');option.value=m;option.textContent=m+'월';$('month').appendChild(option);}for(var d=1;d<=31;d++){var dayOption=document.createElement('option');dayOption.value=d;dayOption.textContent=d+'일';$('day').appendChild(dayOption);}
  for(var i=0;i<=12;i++){(function(month){var button=document.createElement('button');button.type='button';button.textContent=month?month+'월':'전체';button.setAttribute('aria-pressed',String(month===0));button.onclick=function(){selectedMonth=month;Array.prototype.forEach.call($('filters').children,function(x){x.setAttribute('aria-pressed',String(x===button));});render();};$('filters').appendChild(button);})(i);}
  $('sort').onchange=render;
  $('form').onsubmit=function(event){event.preventDefault();var item={name:$('name').value.trim(),memo:$('memo').value.trim(),month:Number($('month').value),day:Number($('day').value)};if(!item.name){message('이름을 입력해 주세요.',false);return;}var maxDay=new Date(2000,item.month,0).getDate();if(item.day>maxDay){message(item.month+'월은 '+maxDay+'일까지 있어요.',false);return;}if(!endpoint){message('아직 Google 시트 연결이 설정되지 않았어요.',false);return;}$('save').disabled=true;message('전송 중...',true);sendBirthday(item).then(function(){message('등록 요청을 보냈어요. 잠시 뒤 시트에서 저장 여부를 확인해 주세요.',true);$('name').value='';$('memo').value='';setTimeout(load,1800);}).catch(function(){message('전송을 시작하지 못했어요. 인터넷과 웹 앱 URL을 확인해 주세요.',false);}).finally(function(){$('save').disabled=false;});};
  load();
})();
</script>
</body>
</html>
