<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101510">
  <meta name="description" content="운동 루틴을 기록하고 휴식 시간을 관리하는 오프라인 운동 앱">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>운동 기록 | MOVE</title>
  <style>
    :root{color-scheme:dark;--bg:#101510;--panel:#1a211b;--panel2:#222b23;--ink:#f2f5ee;--muted:#a3afa3;--line:#303b31;--lime:#c8f169;--lime-ink:#17200b;--orange:#ff9b72;--radius:22px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 95% 0%,#283b25 0,transparent 34%),var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{width:min(100%,620px);margin:auto;padding:20px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 24px}.brand{font-size:.76rem;letter-spacing:.2em;color:var(--lime);font-weight:900}.install{border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:9px 14px;font-weight:700;font-size:.84rem}.hero{padding:24px 22px 22px;border:1px solid #354433;border-radius:28px;background:linear-gradient(145deg,#283624,#1b241b 70%);margin-bottom:20px}.eyebrow{margin:0 0 8px;color:var(--lime);font-size:.75rem;font-weight:800;letter-spacing:.13em}.hero h1{font-size:clamp(2rem,10vw,3rem);line-height:1.04;letter-spacing:-.06em;margin:0 0 10px}.hero p:last-child{margin:0;color:#c0c9bd;font-size:.92rem}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}.section-head h2{margin:0;font-size:1.1rem}.quiet{color:var(--muted);font-size:.8rem}.routine-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.routine{min-height:84px;border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:12px 9px;text-align:left}.routine strong{display:block;font-size:.9rem;margin-bottom:4px}.routine span{font-size:.74rem;color:var(--muted)}.routine[aria-pressed=true]{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-top:12px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-title h2{font-size:1rem;margin:0}.add{border:0;border-radius:999px;background:var(--lime);color:var(--lime-ink);padding:9px 13px;font-weight:900}.exercise{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.check{width:24px;height:24px;accent-color:var(--lime)}.exercise-name{font-weight:800}.exercise-detail{color:var(--muted);font-size:.78rem;margin-top:3px}.exercise-actions{display:flex;align-items:center;gap:7px}.step{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-width:34px;height:34px}.sets{font-size:.82rem;min-width:42px;text-align:center}.remove{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.primary,.secondary{min-height:50px;border-radius:15px;font-weight:900}.primary{border:0;background:var(--lime);color:var(--lime-ink)}.secondary{border:1px solid var(--line);background:var(--panel2)}.timer{display:flex;align-items:center;justify-content:space-between;gap:12px}.timer strong{font-size:2rem;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.timer-controls{display:flex;gap:7px}.timer-controls button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 11px}.history{display:grid;gap:8px}.history-item{display:flex;justify-content:space-between;gap:12px;background:var(--panel2);padding:12px;border-radius:14px;font-size:.84rem}.history-item span{color:var(--muted)}.empty{color:var(--muted);font-size:.88rem;text-align:center;padding:12px}.note{margin:20px 4px 0;color:var(--muted);font-size:.74rem;line-height:1.6}.dialog{width:min(calc(100% - 32px),420px);border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--ink);padding:22px}.dialog::backdrop{background:#0009}.dialog h2{margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0;color:var(--muted);font-size:.82rem}.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px}.dialog-actions{display:flex;gap:8px;margin-top:18px}.dialog-actions button{flex:1}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--lime);color:var(--lime-ink);font-weight:800;padding:11px 16px;border-radius:999px;transition:.2s;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}[hidden]{display:none!important}@media(min-width:540px){.app{padding-top:30px}.hero{padding:30px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><span class="brand">MOVE · WORKOUT LOG</span><button class="install" id="installBtn" type="button" hidden>앱 설치</button></header>
    <section class="hero"><p class="eyebrow" id="todayLabel">TODAY</p><h1>오늘도<br>움직여요.</h1><p>내 페이스대로 운동하고, 작은 성취를 기록해요.</p></section>
    <div class="section-head"><h2>오늘의 루틴</h2><span class="quiet">원하는 루틴을 선택하세요</span></div>
    <div class="routine-list" role="group" aria-label="운동 루틴">
      <button class="routine" data-routine="전신" aria-pressed="true"><strong>⚡ 전신</strong><span>기본 전신 운동</span></button>
      <button class="routine" data-routine="상체"><strong>💪 상체</strong><span>푸시 · 풀</span></button>
      <button class="routine" data-routine="하체"><strong>🦵 하체</strong><span>하체 · 코어</span></button>
    </div>
    <section class="panel" aria-labelledby="workoutTitle">
      <div class="panel-title"><h2 id="workoutTitle">전신 운동</h2><button class="add" id="addBtn" type="button">＋ 운동 추가</button></div>
      <div id="exerciseList"></div>
      <div class="actions"><button class="primary" id="finishBtn" type="button">운동 완료 기록</button><button class="secondary" id="clearBtn" type="button">체크 초기화</button></div>
    </section>
    <section class="panel" aria-labelledby="timerTitle">
      <div class="panel-title"><h2 id="timerTitle">⏱️ 휴식 타이머</h2><span class="quiet">기본 01:00</span></div>
      <div class="timer"><strong id="timerDisplay" aria-live="polite">01:00</strong><div class="timer-controls"><button id="minusBtn" type="button" aria-label="10초 줄이기">−10초</button><button id="timerBtn" type="button">시작</button><button id="plusBtn" type="button" aria-label="10초 늘리기">＋10초</button></div></div>
    </section>
    <section class="panel" aria-labelledby="historyTitle"><div class="panel-title"><h2 id="historyTitle">📅 최근 운동 기록</h2><button class="remove" id="clearHistoryBtn" type="button" aria-label="운동 기록 모두 삭제">기록 삭제</button></div><div class="history" id="historyList"></div></section>
    <p class="note">기록은 이 기기의 브라우저에만 저장됩니다. 운동은 무리하지 말고 본인의 컨디션에 맞춰 진행하세요. 이 앱은 의료 조언을 제공하지 않습니다.</p>
  </main>
  <dialog class="dialog" id="exerciseDialog"><form id="exerciseForm"><h2>운동 추가하기</h2><label class="field">운동 이름<input id="exerciseName" required maxlength="30" placeholder="예: 플랭크"></label><label class="field">세트 수<input id="exerciseSets" type="number" min="1" max="20" value="3" required></label><div class="dialog-actions"><button class="secondary" type="button" id="cancelDialog">취소</button><button class="primary" type="submit">추가하기</button></div></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function(){
      var defaults={
        '전신':[{name:'스쿼트',sets:3},{name:'푸시업',sets:3},{name:'플랭크',sets:3}],
        '상체':[{name:'푸시업',sets:3},{name:'덤벨 로우',sets:3},{name:'숄더 프레스',sets:3}],
        '하체':[{name:'스쿼트',sets:3},{name:'런지',sets:3},{name:'힙 브릿지',sets:3}]
      };
      var state={routine:'전신',exercises:[],history:[]},remaining=60,timerId=null,installPrompt=null;
      var $=function(id){return document.getElementById(id)};
      function load(){try{var saved=JSON.parse(localStorage.getItem('move-workout-v1')||'{}');state.routine=saved.routine||'전신';state.exercises=Array.isArray(saved.exercises)?saved.exercises:defaults[state.routine].map(function(x){return Object.assign({},x,{done:false});});state.history=Array.isArray(saved.history)?saved.history:[];}catch(e){state.exercises=defaults['전신'].map(function(x){return Object.assign({},x,{done:false});});}}
      function save(){try{localStorage.setItem('move-workout-v1',JSON.stringify(state));}catch(e){toast('저장 공간이 부족해요.');}}
      function toast(message){var el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(function(){el.classList.remove('show');},2200);}
      function render(){ $('workoutTitle').textContent=state.routine+' 운동';document.querySelectorAll('.routine').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.routine===state.routine));});var list=$('exerciseList');list.innerHTML='';if(!state.exercises.length){list.innerHTML='<p class="empty">운동을 추가해 오늘의 루틴을 만들어 보세요.</p>';}
        state.exercises.forEach(function(ex,i){var row=document.createElement('div');row.className='exercise';var check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=!!ex.done;check.setAttribute('aria-label',ex.name+' 완료');check.addEventListener('change',function(){ex.done=check.checked;save();});var info=document.createElement('div');var name=document.createElement('div');name.className='exercise-name';name.textContent=ex.name;var detail=document.createElement('div');detail.className='exercise-detail';detail.textContent='목표 '+ex.sets+'세트';info.append(name,detail);var controls=document.createElement('div');controls.className='exercise-actions';var less=document.createElement('button');less.type='button';less.className='step';less.textContent='−';less.setAttribute('aria-label',ex.name+' 세트 줄이기');less.onclick=function(){ex.sets=Math.max(1,ex.sets-1);save();render();};var count=document.createElement('span');count.className='sets';count.textContent=ex.sets+'세트';var more=document.createElement('button');more.type='button';more.className='step';more.textContent='+';more.setAttribute('aria-label',ex.name+' 세트 늘리기');more.onclick=function(){ex.sets=Math.min(20,ex.sets+1);save();render();};var remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',ex.name+' 삭제');remove.onclick=function(){state.exercises.splice(i,1);save();render();};controls.append(less,count,more,remove);row.append(check,info,controls);list.appendChild(row);});renderHistory();}
      function renderHistory(){var root=$('historyList');root.innerHTML='';if(!state.history.length){root.innerHTML='<p class="empty">아직 기록이 없어요. 첫 운동을 완료해 보세요!</p>';return;}state.history.slice(0,7).forEach(function(item){var row=document.createElement('div');row.className='history-item';var title=document.createElement('strong');title.textContent=item.routine+' · '+item.count+'개 운동';var time=document.createElement('span');time.textContent=item.date;row.append(title,time);root.appendChild(row);});}
      document.querySelectorAll('.routine').forEach(function(button){button.addEventListener('click',function(){state.routine=button.dataset.routine;state.exercises=defaults[state.routine].map(function(x){return Object.assign({},x,{done:false});});save();render();});});
      $('addBtn').onclick=function(){$('exerciseName').value='';$('exerciseSets').value='3';$('exerciseDialog').showModal();$('exerciseName').focus();};$('cancelDialog').onclick=function(){$('exerciseDialog').close();};
      $('exerciseForm').onsubmit=function(event){event.preventDefault();state.exercises.push({name:$('exerciseName').value.trim(),sets:Math.max(1,Number($('exerciseSets').value)||3),done:false});save();render();$('exerciseDialog').close();toast('운동을 추가했어요.');};
      $('clearBtn').onclick=function(){state.exercises.forEach(function(ex){ex.done=false;});save();render();toast('체크를 초기화했어요.');};
      $('finishBtn').onclick=function(){var completed=state.exercises.filter(function(ex){return ex.done;}).length;if(!completed){toast('완료한 운동을 먼저 체크해 주세요.');return;}state.history.unshift({routine:state.routine,count:completed,date:new Intl.DateTimeFormat('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date())});state.history=state.history.slice(0,30);state.exercises.forEach(function(ex){ex.done=false;});save();render();toast('오늘의 운동을 기록했어요!');};
      $('clearHistoryBtn').onclick=function(){if(state.history.length&&confirm('저장된 운동 기록을 모두 삭제할까요?')){state.history=[];save();renderHistory();toast('기록을 삭제했어요.');}};
      function showTimer(){var m=Math.floor(remaining/60),s=remaining%60;$('timerDisplay').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
      function stopTimer(){clearInterval(timerId);timerId=null;$('timerBtn').textContent='시작';}
      $('timerBtn').onclick=function(){if(timerId){stopTimer();return;}if(remaining<=0)remaining=60;$('timerBtn').textContent='멈춤';timerId=setInterval(function(){remaining--;showTimer();if(remaining<=0){stopTimer();toast('휴식 시간이 끝났어요!');if('vibrate'in navigator)navigator.vibrate([150,80,150]);}},1000);};
      $('minusBtn').onclick=function(){remaining=Math.max(0,remaining-10);showTimer();};$('plusBtn').onclick=function(){remaining+=10;showTimer();};
      $('todayLabel').textContent=new Intl.DateTimeFormat('ko-KR',{weekday:'long',month:'long',day:'numeric'}).format(new Date()).toUpperCase();
      window.addEventListener('beforeinstallprompt',function(event){event.preventDefault();installPrompt=event;$('installBtn').hidden=false;});$('installBtn').onclick=async function(){if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installBtn').hidden=true;};
      if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){toast('오프라인 저장을 설정하지 못했어요.');});});}
      load();render();showTimer();
    })();
  </script>
</body>
</html>
