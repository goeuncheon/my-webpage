<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 시작</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #111111;
    --gray-900: #1A1A1A;
    --gray-600: #5F6368;
    --gray-400: #9AA0A6;
    --gray-200: #E8EAED;
    --gray-100: #F1F3F4;
    --white: #FFFFFF;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--white);
    color: var(--gray-900);
    font-family: 'Noto Sans KR', 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    max-width: 720px;
    margin: 0 auto;
    padding: 96px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- 시계 ---------- */
  .clock-wrap{
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
  }

  .clock{
    font-family: 'Inter', sans-serif;
    font-weight: 200;
    font-size: clamp(64px, 13vw, 128px);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--black);
    margin: 0;
    text-align: center;
  }

  .clock .colon{
    display: inline-block;
    animation: blink 2s steps(1) infinite;
  }

  @media (prefers-reduced-motion: reduce){
    .clock .colon{ animation: none; }
  }

  @keyframes blink{
    0%, 45%{ opacity: 1; }
    50%, 95%{ opacity: 0.25; }
    100%{ opacity: 1; }
  }

  .period{
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: var(--gray-400);
    align-self: center;
    padding-bottom: 0.4em;
  }

  .date-row{
    font-size: 15px;
    font-weight: 400;
    color: var(--gray-600);
    margin: 16px 0 44px;
    text-align: center;
    position: relative;
    padding-top: 20px;
  }

  .date-row::before{
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 1px;
    background: var(--gray-200);
  }

  /* ---------- 검색바 ---------- */
  .search-form{
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    max-width: 560px;
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: 999px;
    padding: 13px 22px;
    transition: box-shadow .15s ease, border-color .15s ease;
  }

  .search-form:focus-within{
    box-shadow: 0 1px 8px rgba(0,0,0,0.12);
    border-color: var(--gray-200);
  }

  .search-form svg{ flex-shrink: 0; color: var(--gray-400); }

  .search-form input{
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    color: var(--gray-900);
    background: transparent;
  }

  .search-form input::placeholder{ color: var(--gray-400); }

  .search-form button{
    border: none;
    background: transparent;
    color: var(--gray-600);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 4px;
  }

  .search-form button:hover{ color: var(--black); }

  /* ---------- 본문 ---------- */
  .layout{
    width: 100%;
    margin-top: 72px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 56px;
  }

  @media (max-width: 600px){
    .layout{ grid-template-columns: 1fr; gap: 48px; }
    .page{ padding-top: 64px; }
  }

  .panel-title{
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-600);
    margin: 0 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .refresh-btn{
    border: none;
    background: none;
    color: var(--gray-400);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
  }

  .refresh-btn:hover{ color: var(--black); text-decoration: underline; }

  /* ---------- 뉴스 ---------- */
  .news-list{
    display: flex;
    flex-direction: column;
  }

  .news-item{
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 14px 0;
    border-bottom: 1px solid var(--gray-100);
  }

  .news-item:first-child{ padding-top: 0; }
  .news-item:last-child{ border-bottom: none; }

  .news-title{
    font-size: 14px;
    font-weight: 400;
    line-height: 1.55;
    margin: 0;
    color: var(--gray-900);
  }

  .news-item:hover .news-title{ text-decoration: underline; }

  .news-meta{
    font-size: 12px;
    color: var(--gray-400);
    margin-top: 5px;
  }

  .news-status{
    font-size: 13px;
    color: var(--gray-400);
    padding: 8px 0;
  }

  /* ---------- 할 일 ---------- */
  .todo-add{
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--gray-200);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }

  .todo-add input{
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 14px;
    color: var(--gray-900);
    padding: 4px 0;
  }

  .todo-add input::placeholder{ color: var(--gray-400); }

  .todo-add button{
    border: none;
    background: none;
    color: var(--gray-400);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
  }

  .todo-add button:hover{ color: var(--black); }

  .todo-list{
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .todo-item{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
  }

  .todo-check{
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid var(--gray-400);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    padding: 0;
    transition: all .15s ease;
  }

  .todo-check.checked{
    background: var(--black);
    border-color: var(--black);
    color: #fff;
  }

  .todo-text{
    flex: 1;
    font-size: 14px;
    color: var(--gray-900);
  }

  .todo-item.done .todo-text{
    color: var(--gray-400);
    text-decoration: line-through;
  }

  .todo-delete{
    border: none;
    background: transparent;
    color: var(--gray-400);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    opacity: 0;
    transition: opacity .15s ease, color .15s ease;
  }

  .todo-item:hover .todo-delete{ opacity: 1; }
  .todo-delete:hover{ color: var(--black); }

  .todo-empty{
    color: var(--gray-400);
    font-size: 13px;
    padding: 10px 0;
  }

  .todo-progress{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--gray-100);
    font-size: 12px;
    color: var(--gray-400);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .progress-track{
    flex: 1;
    height: 2px;
    background: var(--gray-200);
    margin: 0 12px;
    overflow: hidden;
  }

  .progress-fill{
    height: 100%;
    background: var(--black);
    transition: width .2s ease;
    width: 0%;
  }
</style>
</head>
<body>

<div class="page">

  <div class="clock-wrap">
    <p class="clock" id="clock">--<span class="colon">:</span>--</p>
    <span class="period" id="period"></span>
  </div>
  <p class="date-row" id="dateRow">-</p>

  <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET" target="_blank">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" name="q" placeholder="검색" autocomplete="off">
    <button type="submit">검색</button>
  </form>

  <div class="layout">

    <div class="news-panel">
      <p class="panel-title">
        <span>기술 뉴스</span>
        <button class="refresh-btn" id="refreshNews">새로고침</button>
      </p>
      <div class="news-list" id="newsList">
        <p class="news-status">불러오는 중...</p>
      </div>
    </div>

    <div class="todo-panel">
      <p class="panel-title"><span>오늘의 할 일</span></p>
      <form class="todo-add" id="todoForm">
        <input type="text" id="todoInput" placeholder="할 일 추가" autocomplete="off">
        <button type="submit" aria-label="추가">+</button>
      </form>
      <ul class="todo-list" id="todoList"></ul>
      <div class="todo-progress" id="todoProgress" style="display:none;">
        <span id="progressLabel">0 / 0</span>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span id="progressPct">0%</span>
      </div>
    </div>

  </div>

</div>

<script>
  // ---------- 시계 & 날짜 ----------
  const clockEl = document.getElementById('clock');
  const periodEl = document.getElementById('period');
  const dateRowEl = document.getElementById('dateRow');
  const days = ['일','월','화','수','목','금','토'];

  function updateClock(){
    const now = new Date();
    const h24 = now.getHours();
    let h = h24 % 12; if (h === 0) h = 12;
    const m = String(now.getMinutes()).padStart(2,'0');
    clockEl.innerHTML = String(h).padStart(2,'0') + '<span class="colon">:</span>' + m;
    periodEl.textContent = h24 < 12 ? 'AM' : 'PM';
    dateRowEl.textContent = now.getFullYear() + '년 ' + (now.getMonth()+1) + '월 ' + now.getDate() + '일 ' + days[now.getDay()] + '요일';
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- 기술 뉴스 ----------
  const newsList = document.getElementById('newsList');
  const refreshBtn = document.getElementById('refreshNews');

  const fallbackNews = [
    { title: 'AI 전환 성패는 기술 도입 순서가 아닌 조직의 변화 관리 역량에 달려있다는 분석', source: 'ITWorld', url: 'https://www.itworld.co.kr/' },
    { title: 'AI 고용 충격, 경력을 막 시작한 청년층에 집중되고 있다는 연구 결과', source: 'ITWorld', url: 'https://www.itworld.co.kr/' },
    { title: '애플 M6 맥 미니, 최저 진입가 두 달 새 300달러 상승', source: 'ITWorld', url: 'https://www.itworld.co.kr/' },
    { title: 'LG전자, 로보틱스 사업 추진 속도... 빅테크 대상 액추에이터 공급 논의 본격화', source: '중앙SUNDAY', url: 'https://news.daum.net/tech' },
    { title: 'AI 데이터센터도 모듈형이 대세... 빠르고 유연한 구축 방식 부상', source: '아시아경제', url: 'https://news.daum.net/tech' },
    { title: '개발자·스타트업을 위한 최신 기술 소식 모음', source: 'GeekNews', url: 'https://news.hada.io/' }
  ];

  function renderNews(items){
    if (!items.length){
      newsList.innerHTML = '<p class="news-status">표시할 뉴스가 없습니다.</p>';
      return;
    }
    newsList.innerHTML = items.slice(0, 6).map(item => `
      <a class="news-item" href="${item.url}" target="_blank" rel="noopener">
        <p class="news-title">${item.title}</p>
        <p class="news-meta">${item.source}</p>
      </a>
    `).join('');
  }

  async function loadNews(){
    newsList.innerHTML = '<p class="news-status">불러오는 중...</p>';
    try{
      const rssUrl = encodeURIComponent('https://news.google.com/rss/search?q=%EA%B8%B0%EC%88%A0&hl=ko&gl=KR&ceid=KR:ko');
      const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + rssUrl);
      if (!res.ok) throw new Error('fetch failed');
      const data = await res.json();
      if (data.status !== 'ok' || !data.items || !data.items.length) throw new Error('empty');
      const items = data.items.map(it => ({
        title: it.title,
        source: (it.title.match(/- (.+)$/) || [])[1] || 'Google 뉴스',
        url: it.link
      }));
      renderNews(items);
    }catch(e){
      renderNews(fallbackNews);
    }
  }

  loadNews();
  refreshBtn.addEventListener('click', loadNews);

  // ---------- 오늘의 할 일 ----------
  const todoForm = document.getElementById('todoForm');
  const todoInput = document.getElementById('todoInput');
  const todoListEl = document.getElementById('todoList');
  const todoProgress = document.getElementById('todoProgress');
  const progressLabel = document.getElementById('progressLabel');
  const progressPct = document.getElementById('progressPct');
  const progressFill = document.getElementById('progressFill');

  const STORAGE_KEY = 'today-dashboard-todos';
  const todayKey = new Date().toDateString();

  function loadTodos(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (parsed.date !== todayKey) return [];
      return parsed.items || [];
    }catch(e){ return []; }
  }

  function saveTodos(items){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: todayKey, items }));
    }catch(e){}
  }

  let todos = loadTodos();

  function renderTodos(){
    if (!todos.length){
      todoListEl.innerHTML = '<li class="todo-empty">할 일을 추가해 보세요</li>';
      todoProgress.style.display = 'none';
      return;
    }
    todoListEl.innerHTML = todos.map((t, i) => `
      <li class="todo-item ${t.done ? 'done' : ''}" data-index="${i}">
        <button class="todo-check ${t.done ? 'checked' : ''}" aria-label="완료 표시">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <span class="todo-text">${t.text}</span>
        <button class="todo-delete" aria-label="삭제">×</button>
      </li>
    `).join('');

    const doneCount = todos.filter(t => t.done).length;
    const pct = Math.round((doneCount / todos.length) * 100);
    todoProgress.style.display = 'flex';
    progressLabel.textContent = doneCount + ' / ' + todos.length;
    progressPct.textContent = pct + '%';
    progressFill.style.width = pct + '%';
  }

  todoForm.addEventListener('submit', e => {
    e.preventDefault();
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    todoInput.value = '';
    saveTodos(todos);
    renderTodos();
  });

  todoListEl.addEventListener('click', e => {
    const item = e.target.closest('.todo-item');
    if (!item) return;
    const index = Number(item.dataset.index);

    if (e.target.closest('.todo-check')){
      todos[index].done = !todos[index].done;
      saveTodos(todos);
      renderTodos();
    }
    if (e.target.closest('.todo-delete')){
      todos.splice(index, 1);
      saveTodos(todos);
      renderTodos();
    }
  });

  renderTodos();
</script>

</body>
</html>
