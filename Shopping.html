<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>우리 반 스마트 장보기 미션</title>
<style>
:root{--ink:#1f2a44;--ac:#4f6df5;--soft:#eef1ff;--ok:#1f9d6b;--no:#d6455d;--line:#dfe4f5}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:#f6f7fd;line-height:1.6}
.w{max-width:820px;margin:0 auto;padding:18px 16px 50px}h1{font-size:1.6rem;margin:6px 0}.s{color:#6b7494;margin:0 0 12px}
.c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
button{font:inherit;cursor:pointer}.b{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:11px 20px;font-weight:700}.b:disabled{opacity:.45;cursor:not-allowed}.b.g{background:var(--soft);color:var(--ink)}
textarea,input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.mc{text-align:center;border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px 10px;color:var(--ink)}.mc:hover{border-color:var(--ac)}.mc .e{font-size:2.6rem}.mc b{display:block}
.bar{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;box-shadow:0 10px 24px -16px rgba(40,60,160,.7);font-size:.82rem;color:#6b7494}
.bar b{display:block;font-size:1.1rem;color:var(--ink)}
.item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}.item.on{border-color:var(--ac);background:var(--soft)}.item .e{font-size:2.2rem}.item .p{color:#6b7494;font-size:.9rem}
.q{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}.q button{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:1.2rem;font-weight:800;color:var(--ink)}.q button:disabled{opacity:.35}
.warn{background:#ffe8ec;color:var(--no);border-radius:12px;padding:8px 12px;font-weight:700;margin:10px 0}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.neg{color:var(--no)}
@media print{.np{display:none!important}body{background:#fff}.c{border:0}}
</style></head><body><div class="w">
<section id="s1"><h1>🛒 우리 반 스마트 장보기 미션</h1><p class="s">미션을 고르고, 정해진 예산 안에서 알뜰하게 장바구니를 채워 보세요.</p><div class="grid" id="ms"></div></section>
<section id="s2" hidden>
 <h1 id="mt"></h1><p class="s" id="tip"></p>
 <div class="bar"><div>예산<b id="uB"></b></div><div>사용 금액<b id="uS"></b></div><div>남은 잔액<b id="uL"></b></div><div>담은 수량<b id="uC"></b></div></div>
 <div class="warn" id="over" hidden>⚠️ 예산을 넘었어요! 수량을 줄이거나 다른 물건으로 바꿔 보세요.</div>
 <div class="grid" id="items" style="margin-top:12px"></div>
 <div class="row"><button class="b g" id="back">← 미션 다시 고르기</button><button class="b" id="go">제출하기</button></div>
</section>
<section id="s3" hidden>
 <h1>🧾 나의 장보기 영수증</h1>
 <div class="c"><b id="rm"></b><table id="rt" style="margin-top:8px"></table><p style="text-align:right;margin:8px 0 0">사용 금액 <b id="rS"></b> · 남은 잔액 <b id="rL"></b></p></div>
 <div class="c"><label for="nm">이름</label><input id="nm" maxlength="15" placeholder="이름을 적어 주세요" style="margin-bottom:10px">
  <label for="why"><b>이 물건들을 선택한 이유를 작성해 주세요</b></label>
  <textarea id="why" rows="5" placeholder="꼭 필요해서 고른 것, 아껴서 줄인 것, 다시 생각해 보니 바꾸고 싶은 것을 적어 보세요. (10자 이상)"></textarea>
  <p class="s" id="wc" style="margin:4px 0 0"></p></div>
 <div class="row np"><button class="b" id="pr" disabled>🖨️ 인쇄 / PDF로 저장</button><button class="b g" id="cp" disabled>📋 결과 복사</button><button class="b g" id="re">다시 하기</button></div>
 <p class="s np" id="cm"></p>
</section></div>
<script>
// 미션·상품은 여기서 수정하면 돼요. 상품: [이모지, 이름, 가격]
var M=[
{e:"🍛",t:"카레 만들기",b:15000,tip:"4인분 카레에 꼭 필요한 재료는 무엇일까요? 간식은 남은 돈으로 골라요.",items:[["🥔","감자",1500],["🥕","당근",1200],["🧅","양파",1000],["🍛","카레 가루",2500],["🥩","돼지고기",6000],["🍚","쌀",4500],["🥛","우유",2300],["🍪","과자",2000],["🥤","콜라",1800],["🍦","아이스크림",1500]]},
{e:"⛺",t:"여름 캠핑 준비하기",b:30000,tip:"안전과 먹거리가 먼저예요. 놀이용품은 예산을 보며 골라요.",items:[["🔦","랜턴",5000],["🧺","돗자리",4000],["🥩","바비큐 고기",9000],["🍡","마시멜로",3000],["💧","생수 6병",3000],["🦟","모기 기피제",4500],["🧴","선크림",7000],["🔫","물총",6000],["🍫","간식 모음",2500],["🎮","휴대용 게임기",15000]]},
{e:"🎂",t:"친구 생일파티 준비하기",b:25000,tip:"친구가 기뻐할 파티를 떠올려 보고, 꼭 필요한 것부터 담아요.",items:[["🎂","케이크",12000],["🎈","풍선 한 묶음",3000],["🧃","주스",1500],["🍕","피자",9000],["🍪","과자",2000],["🕯️","초",1500],["💌","초대 카드",2000],["🎁","선물",8000],["🎉","고깔모자",1500],["🍓","과일 접시",5000]]}];
var $=function(i){return document.getElementById(i)},won=function(n){return n.toLocaleString("ko-KR")+"원"},cur,qty;
M.forEach(function(m,i){var b=document.createElement("button");b.className="mc";b.innerHTML='<span class="e">'+m.e+'</span><b>'+m.t+'</b><span>예산 '+won(m.b)+'</span>';b.onclick=function(){start(i)};$("ms").appendChild(b);});
function show(id){["s1","s2","s3"].forEach(function(s){$(s).hidden=s!==id});window.scrollTo(0,0);}
function calc(){var s=0,c=0;qty.forEach(function(q,i){s+=q*cur.items[i][2];c+=q});return{s:s,c:c};}
function start(i){cur=M[i];qty=cur.items.map(function(){return 0});$("mt").textContent=cur.e+" "+cur.t;$("tip").textContent=cur.tip;
 $("items").innerHTML="";cur.items.forEach(function(it,k){var d=document.createElement("div");d.className="item";d.id="it"+k;d.innerHTML='<div class="e">'+it[0]+'</div><b>'+it[1]+'</b><div class="p">'+won(it[2])+'</div><div class="q"><button data-k="'+k+'" data-d="-1" aria-label="'+it[1]+' 빼기">−</button><b id="q'+k+'">0</b><button data-k="'+k+'" data-d="1" aria-label="'+it[1]+' 담기">+</button></div>';$("items").appendChild(d);});
 upd();show("s2");}
$("items").onclick=function(e){var b=e.target.closest("button[data-k]");if(!b)return;var k=+b.dataset.k;qty[k]=Math.max(0,Math.min(20,qty[k]+ +b.dataset.d));upd();};
function upd(){var r=calc(),left=cur.b-r.s;$("uB").textContent=won(cur.b);$("uS").textContent=won(r.s);$("uL").textContent=won(left);$("uL").style.color=left<0?"#d6455d":"";$("uC").textContent=r.c+"개";
 $("over").hidden=left>=0;$("go").disabled=left<0||r.c===0;
 qty.forEach(function(q,k){$("q"+k).textContent=q;$("it"+k).className="item"+(q?" on":"");document.querySelector('#it'+k+' [data-d="-1"]').disabled=!q;});}
$("back").onclick=function(){show("s1")};
$("go").onclick=function(){var r=calc();$("rm").textContent=cur.e+" "+cur.t+" (예산 "+won(cur.b)+")";
 var h="<tr><th>품목</th><th>수량</th><th>금액</th></tr>";qty.forEach(function(q,k){if(q)h+="<tr><td>"+cur.items[k][0]+" "+cur.items[k][1]+"</td><td>"+q+"개</td><td>"+won(q*cur.items[k][2])+"</td></tr>";});
 $("rt").innerHTML=h;$("rS").textContent=won(r.s);$("rL").textContent=won(cur.b-r.s);$("why").value="";chk();show("s3");};
function chk(){var n=$("why").value.trim().length,ok=n>=10;$("pr").disabled=!ok;$("cp").disabled=!ok;$("wc").textContent=ok?"좋아요! 이제 저장할 수 있어요. ("+n+"자)":"10자 이상 적으면 인쇄·복사 버튼이 켜져요. ("+n+"자)";}
$("why").oninput=chk;
function txt(){var r=calc(),t="[스마트 장보기 미션] "+cur.t+"\n이름: "+($("nm").value.trim()||"(이름 없음)")+"\n예산: "+won(cur.b)+"\n";qty.forEach(function(q,k){if(q)t+="- "+cur.items[k][1]+" × "+q+" = "+won(q*cur.items[k][2])+"\n";});return t+"사용 금액: "+won(r.s)+" / 남은 잔액: "+won(cur.b-r.s)+"\n\n[구매 이유]\n"+$("why").value.trim();}
$("pr").onclick=function(){window.print()};
$("cp").onclick=function(){var t=txt();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){$("cm").textContent="복사했어요! 메모장이나 문서에 붙여 넣어 보세요."},function(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");$("cm").textContent="복사했어요!"}catch(e){$("cm").textContent="복사하지 못했어요. 인쇄 버튼을 써 주세요."}a.remove();});};
$("re").onclick=function(){show("s1")};
</script></body></html>
