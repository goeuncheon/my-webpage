<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="말하기 어려운 고민을 선생님께 익명으로 전하는 비밀 우체통">
<meta name="theme-color" content="#f7f5ff">
<title>비밀 우체통 | 천고은</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{--ink:#1f1b3d;--sub:#6d6a8a;--accent:#6c4de6;--pink:#ff7eb6;--line:#e9e5fb;--soft:#f1edff;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;line-height:1.7;background:radial-gradient(900px 520px at 8% -8%,#e6dcff 0,transparent 62%),radial-gradient(700px 420px at 100% 0,#ffe2f0 0,transparent 60%),#faf9ff}.wrap{max-width:760px;margin:auto;padding:22px 18px 50px}.homelink{display:inline-block;margin-bottom:20px;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--accent);font-weight:700;text-decoration:none}.top{text-align:center;margin:14px 0 25px}.kicker{display:inline-block;margin:0 0 10px;padding:4px 14px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:.76rem;font-weight:800;letter-spacing:.08em}h1{margin:0;font-size:clamp(2rem,7vw,2.8rem);line-height:1.2;letter-spacing:-.04em}.sub{color:var(--sub);margin:8px 0 0}.panel{padding:clamp(18px,5vw,30px);border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.94);box-shadow:0 24px 60px -42px #5641a6}.banner{padding:11px 14px;margin:0 0 18px;border-radius:14px;font-size:.88rem;font-weight:700}.banner.ready{background:#e5f6f3;color:#1f705d}.banner.setup{background:#fff7dc;color:#805700}.mail{max-width:560px;margin:auto;padding:22px;border:2px solid var(--ink);border-radius:20px;background:#fff;box-shadow:7px 7px 0 var(--accent)}.mail h2{margin:8px 0 0;font-size:1.25rem}.mail label{display:block;margin:15px 0 5px;font-weight:700;font-size:.9rem}.mail input,.mail textarea{display:block;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit}.mail textarea{min-height:150px;resize:vertical;line-height:1.6}.cnt{text-align:right;color:var(--sub);font-size:.8rem}.btn{border:0;border-radius:999px;padding:11px 20px;background:linear-gradient(135deg,#6c4de6,#8e6cf7);color:white;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:wait}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.msg{min-height:1.6em;margin:10px 0 0;font-weight:700}.msg.ok{color:#237a4b}.msg.no{color:#b42318}.done{text-align:center;padding:24px 0}.big{font-size:3rem}.care{max-width:560px;margin:20px auto 0;padding:12px 16px;border-radius:16px;background:var(--soft);color:#3d3a66;font-size:.88rem}.qr{margin:20px auto 0;text-align:center}.qr canvas,.qr img{display:block;margin:12px auto}.qr code{display:block;word-break:break-all;margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.82rem}footer{text-align:center;margin-top:25px;color:var(--sub);font-size:.86rem}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<a class="homelink" href="index.html#projects">← 천고은의 홈페이지</a>
<header class="top"><p class="kicker">구글 시트 연동 · 비밀 우체통</p><h1>마음속 이야기를<br>전해 주세요 💌</h1><p class="sub">이름은 비워 두어도 괜찮아요.</p></header>
<section class="panel" aria-label="비밀 우체통">
<p class="banner setup" id="banner" role="status"></p>
<div id="formBox"><form class="mail" id="form"><h2>📮 비밀 우체통</h2><p class="sub" style="font-size:.9rem">보낸 내용은 선생님이 관리하는 Google 스프레드시트에 저장됩니다.</p>
<label for="name">이름 (선택)</label><input id="name" name="name" type="text" maxlength="20" autocomplete="off" placeholder="비워 두면 익명으로 보내져요">
<label for="text">고민 내용</label><textarea id="text" name="text" maxlength="1000" required placeholder="마음속 이야기를 적어 주세요"></textarea><div class="cnt"><span id="cnt">0</span> / 1000</div>
<div class="row"><button class="btn" id="send" type="submit">우체통에 넣기</button></div><p class="msg" id="msg" role="status" aria-live="polite"></p></form></div>
<div class="done" id="doneBox" hidden><div class="big" aria-hidden="true">📮</div><h2>전송 요청을 보냈어요!</h2><p class="sub">고마워요. 선생님이 시트에서 내용을 확인할 거예요.</p><button class="btn" id="again" type="button" style="margin-top:12px">한 번 더 쓰기</button></div>
<p class="care">💛 지금 너무 힘들거나 위험하다고 느껴지면 우체통에만 쓰지 말고 가까운 어른에게 바로 이야기해 주세요. 청소년상담전화 1388에서도 도움받을 수 있어요.</p>
<div class="qr"><button class="btn ghost" id="qrBtn" type="button">📱 접속용 QR 코드 보기</button><div id="qrBox" hidden><div id="qrCanvas"></div><code id="qrUrl"></code></div></div>
</section><footer>만든 사람 천고은 · 컴퓨터교육 × 문헌정보</footer>
</main>
<script>
// Apps Script 웹 앱을 배포한 뒤 URL을 따옴표 안에 붙여 넣으세요. 설정 방법은 secret-gas/README.md 참고.
var SHEETS_WEB_APP_URL = "";
(function(){
  var $=function(id){return document.getElementById(id);};
  var configured=/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(SHEETS_WEB_APP_URL);
  $('banner').className='banner '+(configured?'ready':'setup');
  $('banner').textContent=configured?'✅ 우체통이 연결되어 있어요. 작성한 내용은 선생님이 관리하는 Google 스프레드시트로 전송됩니다.':'⚙️ 아직 시트 연결 설정이 필요해요. 관리자에게 연결을 요청해 주세요.';
  $('text').addEventListener('input',function(){$('cnt').textContent=this.value.length;});
  function message(text,ok){$('msg').textContent=text;$('msg').className='msg '+(ok?'ok':'no');}
  $('form').addEventListener('submit',async function(event){
    event.preventDefault();var text=$('text').value.trim();if(!text){message('고민 내용을 적어 주세요.',false);return;}
    if(!configured){message('아직 Google 시트 연결이 설정되지 않았어요. 관리자에게 알려 주세요.',false);return;}
    $('send').disabled=true;message('전송 요청 중...',true);
    try{
      var body=new URLSearchParams({name:$('name').value.trim(),text:text});
      // Apps Script는 브라우저 CORS 응답을 노출하지 않으므로 no-cors로 전송합니다.
      // 요청을 보냈다는 뜻이며, 실제 저장 여부는 담당자가 시트에서 확인해야 합니다.
      await fetch(SHEETS_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString()});
      $('formBox').hidden=true;$('doneBox').hidden=false;$('text').value='';$('name').value='';$('cnt').textContent='0';
    }catch(error){message('전송에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.',false);}
    finally{$('send').disabled=false;}
  });
  $('again').addEventListener('click',function(){$('doneBox').hidden=true;$('formBox').hidden=false;$('text').focus();});
  $('qrBtn').addEventListener('click',function(){var box=$('qrBox');box.hidden=!box.hidden;if(box.hidden)return;$('qrUrl').textContent=location.href.split('#')[0];if(window.QRCode&&!$('qrCanvas').hasChildNodes()){new QRCode($('qrCanvas'),{text:location.href.split('#')[0],width:200,height:200});}});
})();
</script>
</body>
</html>
