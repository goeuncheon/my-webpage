<!DOCTYPE html>
<html lang="ko"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>단체 티셔츠 사이즈 조사</title>
<style>
:root{--ink:#1f2a44;--ac:#4f6df5;--soft:#eef1ff;--ok:#1f9d6b;--no:#d6455d;--line:#dfe4f5}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:#f6f7fd;line-height:1.6}
.w{max-width:560px;margin:0 auto;padding:18px 16px 50px}h1{font-size:1.5rem;margin:6px 0}.s{color:#6b7494;margin:0 0 10px}
.c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
label{display:grid;gap:4px;font-weight:700;margin-bottom:12px}input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
.b{font:inherit;border:0;background:var(--ac);color:#fff;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;width:100%}.b:disabled{opacity:.5}
.m{min-height:1.4em;font-weight:700;font-size:.92rem;margin:8px 0 0}.ok{color:var(--ok)}.no{color:var(--no)}
.r{display:grid;grid-template-columns:48px 1fr 34px;gap:8px;align-items:center;margin:6px 0}.t{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}.t i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s}
</style></head><body><div class="w">
<h1>👕 단체 티셔츠 사이즈 조사</h1><p class="s">이름·번호·사이즈를 고르고 제출해요. 같은 번호로 다시 제출하면 새 사이즈로 바뀌어요.</p>
<form class="c" id="f"><label>이름<input id="nm" maxlength="20" required autocomplete="off"></label><label>번호<select id="no"></select></label><label>사이즈<select id="sz"></select></label><button class="b" id="go">제출하기</button><p class="m" id="m" role="status"></p></form>
<div class="c"><b>실시간 사이즈 현황</b> <span class="s" id="tot"></span><div id="bars"></div></div></div>
<script>
function run(fn){var a=[].slice.call(arguments,1);return new Promise(function(ok,no){google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){no(new Error(e&&e.message||e))})[fn].apply(null,a)})}
var $=function(i){return document.getElementById(i)},ready=false;
function load(){run("getCounts").then(function(d){
 if(!ready){ready=true;for(var i=1;i<=d.max;i++)$("no").add(new Option(i+"번",i));d.sizes.forEach(function(s){$("sz").add(new Option(s,s))});}
 var mx=Math.max(1,Math.max.apply(null,d.sizes.map(function(s){return d.counts[s]})));$("tot").textContent="· 지금까지 "+d.total+"명";
 $("bars").innerHTML=d.sizes.map(function(s){return '<div class="r"><b>'+s+'</b><div class="t"><i style="width:'+d.counts[s]/mx*100+'%"></i></div><span>'+d.counts[s]+'</span></div>'}).join("");
}).catch(function(e){$("m").className="m no";$("m").textContent=e.message})}
$("f").onsubmit=function(e){e.preventDefault();$("go").disabled=true;$("m").className="m";$("m").textContent="보내는 중...";
 run("submitSize",$("no").value,$("nm").value,$("sz").value).then(function(r){$("m").className="m ok";$("m").textContent=r.updated?"이미 낸 번호라서 새 사이즈로 바꿨어요!":"제출 완료! 고마워요 😊";load()})
 .catch(function(er){$("m").className="m no";$("m").textContent=er.message}).then(function(){$("go").disabled=false})};
load();setInterval(load,10000);
</script></body></html>
