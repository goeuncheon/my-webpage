<!DOCTYPE html>
<html lang="ko"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>활동성향 분석 (교사용)</title>
<style>
:root{--ink:#27304d;--ac:#7c5cf0;--soft:#f1edff;--no:#d6455d;--line:#e3dcfa}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:#f8f6ff;line-height:1.6}
.w{max-width:900px;margin:0 auto;padding:18px 16px 60px}h1{font-size:1.5rem;margin:6px 0}.s{color:#6f6a94}
.c{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
input{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px}
.b{font:inherit;border:0;background:var(--ac);color:#fff;border-radius:12px;padding:9px 18px;font-weight:700;cursor:pointer}.b.g{background:var(--soft);color:var(--ink)}
.m{font-weight:700;color:var(--no);min-height:1.4em}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}tr[data-i]{cursor:pointer}tr[data-i]:hover{background:var(--soft)}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.g4>div{background:var(--soft);border-radius:14px;padding:10px 14px}
.bar{display:grid;grid-template-columns:70px 1fr 36px;gap:8px;align-items:center;margin:6px 0}.t{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}.t i{display:block;height:100%;border-radius:99px}
@media print{.np{display:none!important}body{background:#fff}}
</style></head><body><div class="w">
<h1 class="np">🧭 학급 활동성향 분석 (교사용)</h1>
<div class="c np" id="gate"><p class="s" style="margin-top:0">교사 비밀번호를 입력해 주세요.</p><input id="pw" type="password" autocomplete="off"> <button class="b" id="ok">확인</button></div>
<p class="m np" id="m" role="status"></p>
<div id="main" hidden>
 <div class="c np"><b>학급 평균</b><div id="avg"></div></div>
 <div class="c np"><b>학생별 결과</b> <span class="s">(이름을 누르면 개인 리포트)</span><table id="t" style="margin-top:6px"></table></div>
 <div class="c np"><b>모둠 추천</b> 한 모둠 <input id="gs" type="number" min="2" max="8" value="4" style="width:70px"> 명 <button class="b g" id="mk">짜기</button><div class="g4" id="gr" style="margin-top:10px"></div><p class="s" style="margin:8px 0 0">주성향이 서로 섞이도록 나눈 참고용 제안이에요.</p></div>
 <div id="one"></div>
 <p class="np"><button class="b g" id="pdf" hidden>📄 개인 리포트 PDF 저장</button></p>
</div></div>
<script>
function run(fn){var a=[].slice.call(arguments,1);return new Promise(function(ok,no){google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){no(new Error(e&&e.message||e))})[fn].apply(null,a)})}
var $=function(i){return document.getElementById(i)},D=[],pw="";
var A=[{n:"탐구",e:"🔍",c:"#5b7cfa"},{n:"표현",e:"🎨",c:"#ee5c9b"},{n:"협력",e:"🤝",c:"#22a97a"},{n:"계획",e:"📅",c:"#e9961f"}];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bars(sc){return A.map(function(x,i){return '<div class="bar"><span>'+x.e+" "+x.n+'</span><div class="t"><i style="width:'+sc[i]/20*100+'%;background:'+x.c+'"></i></div><b>'+(+sc[i]).toFixed(sc[i]%1?1:0)+'</b></div>'}).join("")}
function radar(sc){function pt(i,k){var a=(-90+i*90)*Math.PI/180;return[(130+Math.cos(a)*85*k).toFixed(1),(130+Math.sin(a)*85*k).toFixed(1)]}
 var g=[.25,.5,.75,1].map(function(k){return '<polygon points="'+[0,1,2,3].map(function(i){return pt(i,k).join(",")}).join(" ")+'" fill="none" stroke="#e3dcfa"/>'}).join("");
 var l=A.map(function(x,i){var p=pt(i,1.28);return '<text x="'+p[0]+'" y="'+p[1]+'" text-anchor="middle" font-size="14" font-weight="700">'+x.e+x.n+'</text>'}).join("");
 return '<svg viewBox="0 0 260 260" style="width:100%;max-width:280px;display:block;margin:auto">'+g+'<polygon points="'+sc.map(function(v,i){return pt(i,v/20).join(",")}).join(" ")+'" fill="rgba(124,92,240,.3)" stroke="#7c5cf0" stroke-width="3"/>'+l+'</svg>'}
function load(){run("getResults",pw).then(function(r){D=r;$("gate").hidden=true;$("main").hidden=false;$("m").textContent="";render()}).catch(function(e){$("m").textContent=e.message})}
function render(){
 if(!D.length){$("avg").innerHTML='<p class="s">아직 제출한 학생이 없어요.</p>';$("t").innerHTML="";return}
 var av=[0,0,0,0];D.forEach(function(r){r.scores.forEach(function(v,i){av[i]+=v/D.length})});$("avg").innerHTML='<p class="s" style="margin:0">제출 '+D.length+'명</p>'+bars(av);
 $("t").innerHTML="<tr><th>이름</th>"+A.map(function(x){return "<th>"+x.n+"</th>"}).join("")+"<th>주성향</th><th>제출</th></tr>"+D.map(function(r,i){return '<tr data-i="'+i+'"><td><b>'+esc(r.name)+"</b></td>"+r.scores.map(function(v){return "<td>"+v+"</td>"}).join("")+"<td>"+esc(r.main)+"</td><td>"+r.at+"</td></tr>"}).join("");}
$("t").onclick=function(e){var tr=e.target.closest("tr[data-i]");if(!tr)return;var r=D[+tr.dataset.i];
 $("one").innerHTML='<div class="c"><h1 style="margin-top:0">'+esc(r.name)+'의 활동성향 리포트</h1>'+radar(r.scores)+bars(r.scores)+'<p><b>주성향: '+esc(r.main)+'</b></p></div>';$("pdf").hidden=false;$("one").scrollIntoView({behavior:"smooth"})};
$("pdf").onclick=function(){window.print()};
$("mk").onclick=function(){var n=Math.max(2,Math.min(8,+$("gs").value||4)),g=Math.max(1,Math.ceil(D.length/n)),L=D.map(function(r){var mx=Math.max.apply(null,r.scores);return{n:r.name,k:r.scores.indexOf(mx),m:r.main}}).sort(function(a,b){return a.k-b.k}),G=[];
 for(var i=0;i<g;i++)G.push([]);L.forEach(function(s,i){G[i%g].push(s)});
 $("gr").innerHTML=G.map(function(m,i){return "<div><b>"+(i+1)+"모둠</b><br>"+m.map(function(s){return esc(s.n)+" <small>("+esc(s.m)+")</small>"}).join("<br>")+"</div>"}).join("")};
$("ok").onclick=function(){pw=$("pw").value;load()};
run("needsTeacherPassword").then(function(n){if(!n)$("m").textContent="관리자가 TEACHER_PASSWORD를 설정해야 결과를 볼 수 있어요."}).catch(function(){});
</script></body></html>
